# Journava — Compose stack (spec §11, §13)
#
# Services: web · api · gnosion · camofox · postgres · redis
#
# This is the ONLY compose file. It lives at the repo root so a bare
# `docker compose up -d` works, and `ops/deploy.sh` drives this same file —
# there is deliberately no second copy under ops/ to drift out of sync.
#
# Nothing here terminates TLS. The stack is a SINGLE public entry point: the
# `web` container's nginx serves the PWA and reverse-proxies /api/* to `api`
# internally — so the whole app lives on one port. On the VPS the shared reverse
# proxy (Caddy / proxy-go / nginx) just forwards the domain to that one loopback
# port; no shared docker network, no per-app TLS.
#
#     <public domain>  ->  127.0.0.1:${JOURNAVA_WEB_PORT:-8401}   (web → serves SPA + /api)
#
# Every published port binds to 127.0.0.1 ONLY, so nothing is exposed on the
# public interface — the reverse proxy is the only thing that reaches them.
# Journava's allocation is the 8400–8409 block (8000/8100/8200/8300 are taken by
# other stacks on the box):
#     8400 -> api (direct health/debug)   8401 -> web (the domain target)
#     8402 -> postgres    8403 -> redis   (loopback dev access; harmless in prod)
# Override any of these with JOURNAVA_WEB_PORT / JOURNAVA_API_PORT /
# POSTGRES_HOST_PORT / REDIS_HOST_PORT in .env if the range clashes.

name: journava

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # web — Vite PWA build served by nginx
  # ---------------------------------------------------------------------------
  web:
    <<: [*restart, *logging]
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    ports:
      - "127.0.0.1:${JOURNAVA_WEB_PORT:-8401}:80"
    depends_on:
      api:
        condition: service_started
    networks: [internal]

  # ---------------------------------------------------------------------------
  # api — FastAPI + LangGraph orchestrator (21 agents)
  # ---------------------------------------------------------------------------
  api:
    <<: [*restart, *logging]
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      # Container-internal DSNs override whatever .env holds for local dev.
      DATABASE_URL: postgresql://${POSTGRES_USER:-journava}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-journava}
      REDIS_URL: redis://redis:6379/0
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_PROXY: ${CAMOFOX_PROXY:-}
      GNOSION_MCP_URL: http://gnosion:8765
      GNOSION_BRAIN_PATH: /srv/data/journava.gnosion
    volumes:
      - api_data:/srv/data
    ports:
      - "127.0.0.1:${JOURNAVA_API_PORT:-8400}:8400"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health always returns 200 and reports what is degraded in its body, so
      # this only proves the app is serving — read the body for dependency state.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8400/health',timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks: [internal]

  # ---------------------------------------------------------------------------
  # gnosion — the brain in MCP mode. Library mode runs in-process inside `api`
  # against the same brain file on the shared api_data volume.
  # ---------------------------------------------------------------------------
  gnosion:
    <<: [*restart, *logging]
    build:
      context: ./gnosion
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      GNOSION_BRAIN_PATH: /srv/data/journava.gnosion
    volumes:
      - api_data:/srv/data
    networks: [internal]
    profiles: [full] # `docker compose --profile full up`

  # ---------------------------------------------------------------------------
  # camofox — hardened-Firefox research service
  # ---------------------------------------------------------------------------
  camofox:
    <<: [*restart, *logging]
    build:
      context: ./camofox
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      # Optional outbound proxy (rotating/residential IP) — set CAMOFOX_PROXY in
      # .env to route the browser through it and sidestep IP rate-limits. Passed
      # via both the browser's own var and the standard proxy vars, best-effort.
      CAMOFOX_PROXY: ${CAMOFOX_PROXY:-}
      HTTP_PROXY: ${CAMOFOX_PROXY:-}
      HTTPS_PROXY: ${CAMOFOX_PROXY:-}
      ALL_PROXY: ${CAMOFOX_PROXY:-}
    # Firefox needs real shared memory or it dies on heavy pages.
    shm_size: "1gb"
    # Not behind a profile: the Research agent's live-crawl path is a headline
    # feature, and without this service it silently degrades to LLM-only.
    networks: [internal]

  # ---------------------------------------------------------------------------
  # postgres — trips, itineraries, bookings, agent events, decision outcomes
  # ---------------------------------------------------------------------------
  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      POSTGRES_USER: ${POSTGRES_USER:-journava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-journava}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-8402}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journava} -d ${POSTGRES_DB:-journava}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  # ---------------------------------------------------------------------------
  # redis — API response cache; guards the free third-party quotas (§5)
  # ---------------------------------------------------------------------------
  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-8403}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_data: # holds data/journava.gnosion — back this up (§13)
