# Journava web — Nginx config
# Serves the Vite PWA build and proxies /api to the FastAPI backend.
# SSE (Server-Sent Events) requires buffering disabled end-to-end.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets. woff2 is already Brotli-compressed internally —
    # gzipping it again only burns CPU, so it is deliberately absent here.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # --- API proxy to FastAPI backend ---
    location /api/ {
        proxy_pass http://api:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running agent operations
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # --- SSE endpoint — disable all buffering ---
    location /api/v1/events {
        proxy_pass http://api:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Critical: disable buffering so SSE events stream immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # keep connection open for 24h
    }

    # --- Static assets (immutable cache for hashed files) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Self-hosted fonts (§10.1) ---
    # Filenames are stable rather than content-hashed, so cache long but allow
    # revalidation instead of marking them immutable.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        types { font/woff2 woff2; }
        try_files $uri =404;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Service worker (never cache at nginx level) ---
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- Manifest + icons ---
    location ~* \.(svg|png|ico|webmanifest)$ {
        expires 7d;
        try_files $uri =404;
    }
}
