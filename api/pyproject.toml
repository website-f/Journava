[project]
name = "journava-api"
version = "0.1.0"
description = "Journava — FastAPI + LangGraph multi-agent travel backend"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "langgraph>=0.3,<1",
    "langchain-core>=0.3,<1",
    "litellm>=1.50,<2",
    "httpx>=0.28,<1",
    "redis>=5.2,<6",
    "asyncpg>=0.30,<1",
    "sse-starlette>=2.1,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# This is a deployed service, not a distributable library — `uv sync` should
# install the dependencies without building the project itself.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
