[project]
name = "journava-api"
version = "0.1.0"
description = "Journava — FastAPI + LangGraph multi-agent travel backend"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "MIT"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "langgraph>=0.3,<1",
    "langchain-core>=0.3,<1",
    "litellm>=1.50,<2",
    "httpx>=0.28,<1",
    "redis>=5.2,<6",
    "asyncpg>=0.30,<1",
    "sse-starlette>=2.1,<3",
    "python-dotenv>=1.0,<2",
    # Fernet encryption for the API Vault / LLM-provider keys (core/vault.py).
    # Was imported but never declared — a saved provider hit ImportError that the
    # 503 handler reported as "database unavailable".
    "cryptography>=43,<47",
    # The Atlas Flight Booking CLI (`atlas-flight`) that tools/atlas_skill.py shells
    # out to. Without it, `atlas-flight: not found` and Atlas is always EMPTY.
    "atlas-flight-booking>=0.3.12,<1",
    # Auth: Argon2id password hashing + JWT access/refresh tokens.
    "argon2-cffi>=23,<25",
    "pyjwt>=2.9,<3",
    # PDF text extraction for the assistant's document upload (booking imports,
    # corporate policy docs). Pure-Python, no native build.
    "pypdf>=5,<7",
    # Multipart form parsing for file uploads (FastAPI UploadFile).
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
# Gnosion is Journava's own memory brain (§7 ①). It is an extra rather than a
# hard dependency so the API still boots without it — `gnosion_client` falls back
# to an in-process store and /health reports `memory_backend` honestly. Install
# it with `uv sync --extra brain` to get real semantic memory.
brain = [
    "gnosion>=0.11,<1",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# This is a deployed service, not a distributable library — `uv sync` should
# install the dependencies without building the project itself.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# E501 is enforced everywhere except where the long lines are single string
# literals a formatter cannot split: LLM prompt templates, SQL statements, and
# mock-data copy. Wrapping those by hand hurts readability and invites drift
# between the prompt as written and the prompt as sent. Real code stays at 100.
"app/agents/prompts.py" = ["E501"]
"app/agents/analytics.py" = ["E501"]
"app/agents/concierge.py" = ["E501"]
"app/agents/crowd.py" = ["E501"]
"app/agents/emergency.py" = ["E501"]
"app/agents/language.py" = ["E501"]
"app/agents/recommendation.py" = ["E501"]
"app/agents/sustainability.py" = ["E501"]
"app/agents/flight.py" = ["E501"]
"app/agents/hotel.py" = ["E501"]
"app/agents/itinerary.py" = ["E501"]
"app/agents/research.py" = ["E501"]
"app/brain/demo_trip.py" = ["E501"]
"app/core/llm_providers.py" = ["E501"]
"app/graph/supervisor.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
